<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pomoblock — Cover (friction)</title>
<link rel="stylesheet" href="assets/tokens.css" />
<style>
  body[data-theme="dark"] {
    width: 390px;
    height: 844px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(70% 45% at 50% 38%, oklch(28% 0.10 255 / 0.55), transparent 70%),
      var(--bg);
    color: var(--fg);
  }

  .status {
    flex: 0 0 47px;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 28px 0;
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--fg); pointer-events: none;
  }
  .status .right { display: inline-flex; align-items: center; gap: 6px; }
  .status svg { width: 17px; height: 11px; fill: currentColor; }
  .status .battery { width: 25px; }

  .head {
    flex: 0 0 auto;
    padding: 16px 24px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .blocked-app {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 10px 6px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .blocked-app .ic {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg,#833ab4,#fd1d1d 70%,#fcb045);
    display: grid; place-items: center;
    color: white;
    font-size: 11px; font-weight: 700;
    letter-spacing: -0.04em;
  }
  .blocked-app span { font-size: 12px; color: var(--fg-2); font-weight: 500; }
  .blocked-app .x { color: var(--muted); margin-left: 2px; }
  .head .step {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .head .step b { color: var(--fg-2); }

  /* Breathing orb */
  .orb-wrap {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 22px;
  }
  .orb {
    width: 220px;
    height: 220px;
    border-radius: 999px;
    position: relative;
    background:
      radial-gradient(60% 60% at 50% 45%,
        color-mix(in oklch, var(--accent) 40%, transparent) 0%,
        color-mix(in oklch, var(--accent) 12%, transparent) 45%,
        transparent 70%);
    display: grid; place-items: center;
    animation: breathe 6s ease-in-out infinite;
  }
  .orb::before, .orb::after {
    content: '';
    position: absolute; inset: 26px;
    border-radius: 999px;
    border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);
    opacity: 0.7;
  }
  .orb::after { inset: 50px; opacity: 0.45; }
  .orb b {
    font-family: var(--font-display);
    font-weight: 200;
    font-size: 18px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--fg-2);
  }
  @keyframes breathe {
    0%, 100% { transform: scale(0.92); opacity: 0.85; }
    50%      { transform: scale(1.04); opacity: 1; }
  }

  .copy-wrap {
    flex: 0 0 auto;
    padding: 18px 32px 0;
    text-align: center;
  }
  h1.calm {
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: -0.026em;
    font-weight: 500;
    text-wrap: balance;
  }
  h1.calm em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }
  .calm-sub {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    text-wrap: pretty;
  }
  .calm-sub b {
    color: var(--fg-2);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* Decision buttons */
  .decide {
    flex: 0 0 auto;
    padding: 16px 24px 6px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .opt {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--fg);
    text-align: left;
    cursor: pointer;
  }
  .opt .glyph {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border-2);
    display: grid; place-items: center;
    color: var(--fg-2);
    flex: 0 0 28px;
  }
  .opt .glyph svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; }
  .opt b {
    display: block;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .opt span {
    display: block;
    margin-top: 2px;
    font-size: 12px;
    color: var(--muted);
    font-feature-settings: "tnum" 1;
  }
  .opt .right {
    margin-left: auto;
    color: var(--faint);
  }
  .opt.primary {
    background: linear-gradient(180deg, color-mix(in oklch, var(--accent) 22%, var(--surface)), var(--surface));
    border-color: color-mix(in oklch, var(--accent) 50%, var(--border));
  }
  .opt.primary .glyph {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  .opt.primary b { color: var(--fg); }

  /* Auto-decision progress */
  .auto {
    padding: 6px 24px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.04em;
  }
  .auto .bar {
    flex: 1;
    height: 2px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .auto .bar i {
    display: block;
    width: 22%;
    height: 100%;
    background: var(--muted);
  }

  .home-indicator {
    flex: 0 0 28px;
    position: relative;
  }
  .home-indicator::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 8px;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--fg);
    border-radius: 999px;
    opacity: 0.55;
  }
</style>
</head>
<body data-theme="dark" data-od-id="cover-friction">

  <div class="status" aria-hidden>
    <span>9:41</span>
    <span class="right">
      <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
      <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1z"/></svg>
      <svg class="battery" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
    </span>
  </div>

  <div class="head">
    <div class="blocked-app">
      <span class="ic">IG</span>
      <span>Instagram</span>
      <span class="x" aria-hidden>covered</span>
    </div>
    <div class="step">Step <b>2/2</b> — decide</div>
  </div>

  <div class="orb-wrap">
    <div class="orb" aria-label="Breathe with the orb">
      <b>Breathe</b>
    </div>
  </div>

  <div class="copy-wrap">
    <h1 class="calm">Breathe.<br/><em>Then decide.</em></h1>
    <p class="calm-sub">You've opened Instagram <b>14 times</b> this week.<br/><b>8</b> of those were during Deep Work.</p>
  </div>

  <div class="decide">
    <button class="opt primary" type="button">
      <div class="glyph">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l2 1.4"/></svg>
      </div>
      <div>
        <b>I'll wait the 25 minutes</b>
        <span>Return to focus · most picked</span>
      </div>
      <span class="right">→</span>
    </button>

    <button class="opt" type="button">
      <div class="glyph">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3l1.4 1"/></svg>
      </div>
      <div>
        <b>Just 5 minutes</b>
        <span>Counts against your daily 30-min budget · 22m left</span>
      </div>
      <span class="right">→</span>
    </button>

    <button class="opt" type="button">
      <div class="glyph">
        <svg viewBox="0 0 16 16"><path d="M2 8h12M9 4l4 4-4 4"/></svg>
      </div>
      <div>
        <b>End the Deep Work block</b>
        <span>1h 38m left · breaks streak (12 days)</span>
      </div>
      <span class="right">→</span>
    </button>
  </div>

  <div class="auto" aria-label="Auto-resume in">
    <span>Auto-resume in 9s</span>
    <span class="bar"><i></i></span>
  </div>

  <div class="home-indicator" aria-hidden></div>

</body>
</html>
