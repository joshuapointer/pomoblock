<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pomoblock — Cover (timer)</title>
<link rel="stylesheet" href="assets/tokens.css" />
<style>
  body[data-theme="dark"] {
    width: 390px;
    height: 844px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(120% 60% at 50% 0%, oklch(20% 0.04 255 / 0.5), transparent 60%),
      radial-gradient(80% 50% at 50% 100%, oklch(28% 0.10 255 / 0.35), transparent 70%),
      var(--bg);
    color: var(--fg);
  }

  .status {
    flex: 0 0 47px;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 18px 28px 0;
    font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--fg); pointer-events: none;
  }
  .status .right { display: inline-flex; align-items: center; gap: 6px; }
  .status svg { width: 17px; height: 11px; fill: currentColor; }
  .status .battery { width: 25px; }

  /* Cover header */
  .cover-head {
    flex: 0 0 auto;
    padding: 16px 24px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .blocked-app {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px 6px 6px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
  }
  .blocked-app .ic {
    width: 22px; height: 22px;
    border-radius: 6px;
    background: linear-gradient(135deg,#833ab4,#fd1d1d 70%,#fcb045);
    display: grid; place-items: center;
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .blocked-app span {
    font-size: 12px;
    color: var(--fg-2);
    font-weight: 500;
  }
  .blocked-app .x {
    color: var(--muted);
    margin-left: 2px;
  }
  .cover-head .live {
    margin-left: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.10em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }
  .cover-head .live .dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{ opacity:1 } 50%{ opacity:0.5 } }

  /* Posture quote */
  .posture {
    flex: 0 0 auto;
    text-align: center;
    padding: 30px 36px 0;
    font-size: 15px;
    color: var(--muted);
    letter-spacing: -0.005em;
    line-height: 1.45;
  }
  .posture em {
    font-style: italic;
    color: var(--fg-2);
  }

  /* Timer */
  .timer-wrap {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .ring {
    width: 300px;
    height: 300px;
    position: relative;
  }
  .ring svg {
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .ring .track {
    fill: none;
    stroke: var(--border);
    stroke-width: 1.2;
  }
  .ring .progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
    /* circumference = 2π·140 ≈ 879.6
       progress at 13% remaining = 879.6 * 0.87 dasharray-offset */
    stroke-dasharray: 879.6;
    stroke-dashoffset: 765.25;
    filter: drop-shadow(0 0 8px color-mix(in oklch, var(--accent) 60%, transparent));
  }
  .ring .tick-marks {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .ring .tick-marks span {
    position: absolute;
    top: 50%; left: 50%;
    width: 1px; height: 6px;
    background: var(--border-2);
    transform-origin: 0 -150px;
    transform: translate(-0.5px, -150px) rotate(var(--a));
  }

  .countdown {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
  }
  .countdown .digits {
    font-family: var(--font-display);
    font-weight: 200;
    font-size: 88px;
    line-height: 0.96;
    letter-spacing: -0.05em;
    color: var(--fg);
    font-variant-numeric: tabular-nums;
    display: inline-flex;
    align-items: baseline;
  }
  .countdown .colon {
    margin: 0 2px;
    color: var(--muted);
    animation: blink 1s steps(1, end) infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }
  .countdown .of {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--faint);
    font-weight: 600;
  }

  /* Session dots */
  .sessions {
    flex: 0 0 auto;
    padding: 0 24px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .session-dots {
    display: inline-flex;
    gap: 8px;
  }
  .session-dots span {
    width: 7px; height: 7px;
    border-radius: 999px;
    background: var(--border-2);
  }
  .session-dots span.done { background: var(--accent); }
  .session-dots span.now {
    background: var(--accent);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 22%, transparent);
  }
  .session-label {
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .session-label b { color: var(--fg-2); font-weight: 600; }

  /* Actions */
  .actions {
    flex: 0 0 auto;
    padding: 16px 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .action-secondary {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--fg-2);
    font-size: 14px;
    padding: 12px;
    border-radius: 12px;
    font-weight: 500;
  }
  .action-tertiary {
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 12px;
    padding: 4px;
    text-align: center;
  }
  .action-tertiary u { text-decoration: underline; text-underline-offset: 2px; color: var(--fg-2); }

  .home-indicator {
    flex: 0 0 28px;
    position: relative;
  }
  .home-indicator::after {
    content: '';
    position: absolute;
    left: 50%; bottom: 8px;
    transform: translateX(-50%);
    width: 134px; height: 5px;
    background: var(--fg);
    border-radius: 999px;
    opacity: 0.55;
  }
</style>
</head>
<body data-theme="dark" data-od-id="cover-pomodoro">

  <div class="status" aria-hidden>
    <span>9:41</span>
    <span class="right">
      <svg viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="0.6"/><rect x="4" y="5" width="3" height="6" rx="0.6"/><rect x="8" y="3" width="3" height="8" rx="0.6"/><rect x="12" y="0" width="3" height="11" rx="0.6"/></svg>
      <svg viewBox="0 0 17 11"><path d="M8.5 1.5C5.5 1.5 2.7 2.6 0.5 4.6L2 6.1C3.8 4.5 6.1 3.6 8.5 3.6c2.4 0 4.7 0.9 6.5 2.5l1.5-1.5c-2.2-2-5-3.1-8-3.1z"/></svg>
      <svg class="battery" viewBox="0 0 25 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" fill="none" stroke="currentColor" stroke-opacity="0.45"/><rect x="22" y="3.5" width="1.5" height="4" rx="0.4" fill="currentColor" fill-opacity="0.45"/><rect x="2" y="2" width="18" height="7" rx="1.4"/></svg>
    </span>
  </div>

  <div class="cover-head">
    <div class="blocked-app">
      <span class="ic">IG</span>
      <span>Instagram</span>
      <span class="x" aria-hidden>covered</span>
    </div>
    <div class="live">
      <span class="dot" aria-hidden></span>
      <span>Deep Work</span>
    </div>
  </div>

  <p class="posture">You opened a covered app. <em>Sit with it for 21 more minutes</em>, or take an honest break.</p>

  <div class="timer-wrap">
    <div class="ring">
      <svg viewBox="0 0 300 300" aria-hidden>
        <circle class="track"    cx="150" cy="150" r="140"/>
        <circle class="progress" cx="150" cy="150" r="140"/>
      </svg>
      <div class="tick-marks" aria-hidden>
        <span style="--a:0deg"></span>
        <span style="--a:30deg"></span>
        <span style="--a:60deg"></span>
        <span style="--a:90deg"></span>
        <span style="--a:120deg"></span>
        <span style="--a:150deg"></span>
        <span style="--a:180deg"></span>
        <span style="--a:210deg"></span>
        <span style="--a:240deg"></span>
        <span style="--a:270deg"></span>
        <span style="--a:300deg"></span>
        <span style="--a:330deg"></span>
      </div>
      <div class="countdown">
        <div class="digits">
          <span>21</span><span class="colon">:</span><span>43</span>
        </div>
        <div class="of">of 25 minutes</div>
      </div>
    </div>
  </div>

  <div class="sessions">
    <div class="session-dots" aria-label="Pomodoros today: 4 of 8">
      <span class="done"></span>
      <span class="done"></span>
      <span class="done"></span>
      <span class="done"></span>
      <span class="now"></span>
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="session-label"><b>Pomodoro 5 of 8</b> · 1h 38m of Deep Work left</div>
  </div>

  <div class="actions">
    <button class="action-secondary" type="button">Take a 5-minute break instead</button>
    <button class="action-tertiary" type="button">Need this app for work? <u>End block early</u></button>
  </div>

  <div class="home-indicator" aria-hidden></div>

</body>
</html>
